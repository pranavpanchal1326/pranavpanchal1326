name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pranavpanchal1326
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#58C4DD&color_dots=#ebedf0,#c0e7f0,#82d1e3,#58C4DD,#2b92a8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58C4DD&color_dots=#161b22,#00444d,#006d7a,#0096a8,#58C4DD

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}